<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngAI RAG Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>EngAI RAG</h1>
                <p class="subtitle">Intelligent Document Assistant</p>
            </div>
            <div class="api-key-section">
                <label for="api-key">API Key:</label>
                <input type="password" id="api-key" placeholder="Enter your API key" autocomplete="off">
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <div class="welcome-icon">💬</div>
                    <h2>Welcome to EngAI RAG</h2>
                    <p>Ask questions about your documents. Your API key is stored locally and never shared.</p>
                </div>
            </div>
        </main>

        <footer class="input-area">
            <form id="chat-form" class="chat-form">
                <div class="input-wrapper">
                    <textarea
                        id="message-input"
                        placeholder="Type your message..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <button type="submit" id="send-button" class="send-button" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="form-footer">
                    <p class="disclaimer">Powered by FastAPI RAG backend</p>
                </div>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
